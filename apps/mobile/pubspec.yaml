name: mirandatune
description: Afinador profissional para cordas e bateria.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  record: ^7.1.2
  dsp:
    path: ../../packages/dsp
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  ffi: ^2.1.0 # ✅ ADICIONADO PARA A PONTE C++

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bateria_topo.png
    - assets/audio/